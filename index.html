<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kemo_otak Command Center</title>
  <style>
    body {
      margin: 0;
      height: 100vh; 
      overflow: hidden; 
      background-color: #0d0d0d;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 35px;
      position: relative;
    }

    /* Secret Button linking exactly to your main portfolio deployment */
    .secret-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      color: #333;
      text-decoration: none;
      font-size: 12px;
      opacity: 0.4;
      transition: 0.4s;
      letter-spacing: 2px;
    }

    .secret-btn:hover {
      opacity: 1;
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffcc;
    }

    .profile-pic {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #00ffcc;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
    }

    .search-container {
      width: 100%;
      text-align: center;
    }
    
    .search-form input {
      padding: 15px 20px;
      width: 50%;
      max-width: 500px;
      background-color: #1a1a1a;
      border: 2px solid #333;
      color: white;
      border-radius: 8px 0 0 8px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    .search-form input:focus {
      border-color: #00ffcc; 
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
    }

    .search-form button {
      padding: 15px 25px;
      background-color: #00ffcc;
      border: none;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      transition: 0.3s;
    }

    .search-form button:hover {
      background-color: #00cca3;
    }

    .portfolio-grid {
      display: flex;
      gap: 20px;
      width: 80%;
      max-width: 800px;
    }

    .card {
      background-color: #111;
      border: 1px solid #00ffcc;
      border-radius: 8px;
      padding: 15px;
      flex: 1;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
    }

    ul {
      list-style-type: none;
      padding: 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .highlight {
      color: #ff0055;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Hidden link directly to your main portfolio deployment -->
  <a href="https://plan-for-tahiti-o4vw83mxl-kareemmohamedharidy-7974s-projects.vercel.app/" class="secret-btn">[ SYS.PORTFOLIO ]</a>

  <img src="sasd.jpg" alt="Kemo_otak" class="profile-pic">

  <div class="search-container">
    <form id="kemo-search" class="search-form" action="https://www.google.com/search" method="get">
      <input type="text" id="search-input" name="q" placeholder="Search the web or enter secret code..." required autofocus autocomplete="off">
      <button type="submit">SEARCH</button>
    </form>
  </div>

  <div class="portfolio-grid">
    <div class="card">
      <h2>/// COMMAND CENTER</h2>
      <ul>
        <li>> NVIDIA RTX 3050 Ti Laptop GPU</li>
        <li>> High Refresh Rate Dual Monitors</li>
        <li>> Soundcore Liberty 4 NC Audio</li>
      </ul>
    </div>
    <div class="card">
      <h2>/// TROPHY ROOM</h2>
      <ul>
        <li>> <span class="highlight">Masterpiece:</span> Red Dead Redemption 2</li>
        <li>> Spider-Man: Platinum / Taskmaster Max</li>
        <li>> Fortnite: Level 100 Battle Pass</li>
      </ul>
    </div>
  </div>

  <script>
    document.getElementById('kemo-search').addEventListener('submit', function(event) {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      if (query === 'the best game ever') {
        event.preventDefault(); 
        alert("Red Dead Redemption 2, like Kemo_otak knows!");
        document.getElementById('search-input').value = '';
      }
    });
  </script>

</body>
</html>
