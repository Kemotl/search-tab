<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kemo_otak Command Center | XEMOX AUDIO</title>
  <link rel="icon" href="sasd.jpg" type="image/jpeg">
  <style>
    body {
      margin: 0;
      height: 100vh; 
      overflow: hidden; 
      background-color: #030b14;
      color: #00e5ff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      position: relative;
    }

    /* --- BACKGROUNDS --- */
    #static-bg, #live-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      transition: opacity 0.5s ease;
    }
    
    #static-bg { background: #030b14; display: none; }
    #live-bg { display: block; }

    /* التعتيم الأصلي بتاعك */
    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 11, 20, 0.6); 
      z-index: -1;
    }

    /* --- TOP CONTROLS (الستايل القديم) --- */
    .controls-container {
      position: absolute;
      top: 15px;
      left: 20px;
      display: flex;
      gap: 10px;
      z-index: 20;
      flex-wrap: wrap;
    }

    .control-btn {
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid #00e5ff;
      color: #00e5ff;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      font-weight: bold;
      backdrop-filter: blur(5px);
      transition: 0.3s;
      text-transform: uppercase;
    }

    .control-btn:hover {
      background: rgba(0, 229, 255, 0.3);
      box-shadow: 0 0 15px #00e5ff;
    }

    /* --- PORTFOLIO SECRET BTN --- */
    .secret-btn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #333;
      text-decoration: none;
      font-size: 12px;
      opacity: 0.4;
      transition: 0.4s;
      letter-spacing: 2px;
      z-index: 100;
    }

    .secret-btn:hover {
      opacity: 1;
      color: #00e5ff;
      text-shadow: 0 0 8px #00e5ff;
    }

    /* --- LYRICS BOX (LIQUID GLASS الفاجر) --- */
    .lyrics-container {
      position: absolute;
      top: 15px;
      right: 20px;
      width: 260px;
      max-height: 350px;
      /* تأثير الإزاز الشفاف بس هنا */
      background: rgba(10, 15, 30, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 229, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      border-radius: 16px;
      padding: 15px;
      z-index: 15;
      display: flex; 
      flex-direction: column;
      transition: opacity 0.3s ease;
    }

    .lyrics-header {
      color: #00e5ff;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 2px;
      text-align: center;
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
      padding-bottom: 10px;
      margin-bottom: 10px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .lyrics-content {
      color: #fff;
      font-size: 13px;
      line-height: 1.8;
      text-align: center;
      overflow-y: auto;
      white-space: pre-wrap;
      scroll-behavior: smooth;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .lyrics-content::-webkit-scrollbar { width: 4px; }
    .lyrics-content::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.5); border-radius: 4px; }

    /* --- PROFILE (الستايل القديم) --- */
    .profile-pic {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #00e5ff;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
      z-index: 1;
      transition: 0.3s;
    }
    
    .profile-pic:hover {
      box-shadow: 0 0 40px rgba(0, 85, 255, 0.8);
      border-color: #0055ff;
    }

    /* --- SEARCH (الستايل القديم) --- */
    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      z-index: 50;
      padding: 0 20px;
      box-sizing: border-box;
    }
    
    .search-form {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .search-form input {
      padding: 12px 20px;
      flex: 1;
      background: rgba(10, 15, 25, 0.8);
      backdrop-filter: blur(10px);
      border: 2px solid #0055ff;
      color: white;
      border-radius: 8px 0 0 8px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
      min-width: 0;
    }

    .search-form input:focus {
      border-color: #00e5ff; 
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
    }

    .search-form button {
      padding: 12px 25px;
      background-color: #00e5ff;
      border: none;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      transition: 0.3s;
    }

    /* --- AUTOCOMPLETE --- */
    .autocomplete-items {
      position: absolute;
      top: 100%;
      left: 20px;
      right: 20px;
      background: rgba(10, 15, 25, 0.95);
      backdrop-filter: blur(15px);
      border: 1px solid #00e5ff;
      border-top: none;
      border-radius: 0 0 8px 8px;
      z-index: 99;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      text-align: left;
    }

    .autocomplete-items div {
      padding: 12px;
      cursor: pointer;
      color: #99aab5;
      font-size: 15px;
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
      transition: 0.2s;
    }

    .autocomplete-items div:hover {
      background-color: rgba(0, 229, 255, 0.2);
      color: #fff;
      padding-left: 20px;
    }

    .autocomplete-items div b {
      color: #00e5ff;
      font-weight: bold;
    }

    .autocomplete-items::-webkit-scrollbar { width: 5px; }
    .autocomplete-items::-webkit-scrollbar-thumb { background: #00e5ff; border-radius: 5px; }

    /* --- QUICK LINKS --- */
    .quick-links {
      display: flex;
      gap: 20px;
      z-index: 1;
      flex-wrap: wrap;
      justify-content: center;
    }

    .shortcut-icon {
      width: 40px;
      height: 40px;
      background: rgba(10, 15, 25, 0.6);
      border: 1px solid #0055ff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #99aab5;
      transition: 0.3s;
      text-decoration: none;
    }

    .shortcut-icon:hover {
      border-color: #00e5ff;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
      color: #00e5ff;
      transform: translateY(-5px);
    }

    /* --- XEMOX CUSTOM PLAYER (الستايل القديم) --- */
    .xemox-player {
      width: 90%;
      max-width: 450px;
      background: rgba(5, 10, 20, 0.7);
      backdrop-filter: blur(15px);
      border: 2px solid #00e5ff;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3), inset 0 0 10px rgba(0, 229, 255, 0.1);
      display: flex;
      flex-direction: column;
      z-index: 10;
      overflow: hidden;
    }

    .xemox-header {
      background: #00e5ff;
      color: #000;
      text-align: center;
      padding: 5px;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .xemox-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
    }

    .xemox-track-info {
      flex: 1;
      text-align: center;
      font-size: 13px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0 10px;
    }
    .xemox-track-artist {
      font-size: 10px;
      color: #00e5ff;
    }

    .x-btn {
      background: none;
      border: none;
      color: #00e5ff;
      font-size: 20px;
      cursor: pointer;
      transition: 0.3s;
    }
    .x-btn:hover { color: #fff; transform: scale(1.2); text-shadow: 0 0 10px #00e5ff; }

    .xemox-playlist {
      max-height: 120px; 
      overflow-y: auto;
      padding: 5px 0;
    }

    .xemox-playlist::-webkit-scrollbar { width: 5px; }
    .xemox-playlist::-webkit-scrollbar-thumb { background: #00e5ff; border-radius: 5px; }

    .playlist-item {
      padding: 8px 20px;
      font-size: 12px;
      color: #99aab5;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      transition: 0.2s;
    }

    .playlist-item:hover, .playlist-item.active {
      background: rgba(0, 229, 255, 0.15);
      color: #fff;
      border-left: 3px solid #00e5ff;
    }

    /* --- MOBILE CUSTOMIZATION --- */
    @media (max-width: 768px) {
      .controls-container { 
        flex-direction: row; 
        justify-content: center; 
        width: 100%; 
        top: 10px; 
        left: 0; 
      }
      .control-btn { padding: 6px 10px; font-size: 10px; }
      
      .lyrics-container {
        top: 50px; 
        right: 10px;
        width: 140px; 
        max-height: 160px;
        padding: 8px;
        border-radius: 12px;
      }
      .lyrics-header { font-size: 10px; padding-bottom: 5px; margin-bottom: 5px; }
      .lyrics-content { font-size: 9px; line-height: 1.4; }

      .search-form input { font-size: 14px; padding: 10px; }
      .search-form button { font-size: 14px; padding: 10px 15px; }
      
      .profile-pic { width: 75px; height: 75px; }
      .xemox-player { width: 95%; }
      .autocomplete-items div { font-size: 12px; padding: 8px; }
    }
  </style>
</head>
<body>

  <video id="live-bg" src="car.mp4" autoplay loop muted playsinline></video>
  <div id="static-bg"></div>
  <div class="bg-overlay"></div>

  <div class="controls-container">
    <button id="toggle-bg-btn" class="control-btn">SWITCH BG</button>

    <input type="file" id="bg-upload" accept="image/*,video/*" hidden>
    <button id="toggle-lyrics-btn" class="control-btn">LYRICS: ON</button>
  </div>

  <a href="https://kemo-otakk.vercel.app" class="secret-btn">[ SYS.PORTFOLIO ]</a>

  <div class="lyrics-container" id="lyrics-box">
    <div class="lyrics-header" id="lyrics-title">LYRICS</div>
    <div class="lyrics-content" id="lyrics-text">Select a track to view lyrics...</div>
  </div>

  <img src="sasd.jpg" alt="Kemo_otak" class="profile-pic">

  <!-- SEARCH BAR with GOOGLE LIVE AUTOCOMPLETE -->
  <div class="search-wrapper">
    <form id="kemo-search" class="search-form" action="https://www.google.com/search" method="get">
      <input type="text" id="search-input" name="q" placeholder="Search the web or enter secret code..." required autocomplete="off" autofocus>
      <button type="submit">SEARCH</button>
    </form>
    <div id="autocomplete-list" class="autocomplete-items"></div>
  </div>

  <div class="quick-links">
    <a href="https://www.youtube.com" class="shortcut-icon" title="YouTube">▶</a>
    <a href="https://gemini.google.com" class="shortcut-icon" title="Gemini">✨</a>
    <a href="https://www.messenger.com/" class="shortcut-icon" title="Messenger">💬</a>
    <a href="https://github.com/Kemotl" class="shortcut-icon" title="GitHub">💻</a>
  </div>

  <div class="xemox-player">
    <div class="xemox-header">⚡ XEMOX™ AUDIO ENGINE ⚡</div>
    <div class="xemox-controls">
      <button class="x-btn" id="x-prev">⏮</button>
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div class="xemox-track-info" id="x-title">Welcome to XemoX</div>
        <div class="xemox-track-artist" id="x-artist">Select a track</div>
      </div>
      <button class="x-btn" id="x-play">▶</button>
      <button class="x-btn" id="x-next">⏭</button>
    </div>
    <div class="xemox-playlist" id="x-list"></div>
    <audio id="x-audio"></audio>
  </div>

  <script>
    // --- FORCE AUTO-FOCUS ON LOAD ---
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('search-input').focus();
      }, 500);
    });

    // --- GOOGLE LIVE AUTOCOMPLETE API ---
    const searchInput = document.getElementById('search-input');
    const autocompleteList = document.getElementById('autocomplete-list');
    let debounceTimer;

    const kemoSuggestions = [
      "best game ever",
      "red dead redemption 2"
    ];

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); 
    }

    searchInput.addEventListener('input', function() {
      const val = this.value.trim().toLowerCase();
      autocompleteList.innerHTML = '';
      
      if (!val) {
        autocompleteList.style.display = 'none';
        return;
      }

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const scriptId = 'google-autocomplete-script';
        let oldScript = document.getElementById(scriptId);
        if (oldScript) oldScript.remove();

        const script = document.createElement('script');
        script.id = scriptId;
        script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(val)}&callback=handleGoogleSuggestions`;
        document.body.appendChild(script);

      }, 300);
    });

    window.handleGoogleSuggestions = function(data) {
       const googleSuggestions = data[1] || [];
       const val = searchInput.value.toLowerCase().trim();
       
       let matches = kemoSuggestions.filter(item => item.toLowerCase().includes(val));
       let combined = [...matches, ...googleSuggestions];
       combined = [...new Set(combined)].slice(0, 8); 

       autocompleteList.innerHTML = '';
       if (combined.length > 0) {
         combined.forEach(item => {
            const div = document.createElement('div');
            
            const safeVal = escapeRegExp(val);
            const boldedItem = item.replace(new RegExp("(" + safeVal + ")", "gi"), "<b>$1</b>");
            div.innerHTML = boldedItem;
            
            div.addEventListener('click', function() {
              searchInput.value = item;
              autocompleteList.style.display = 'none';
              
              if ((item.includes('best') && item.includes('game')) || item.includes('red dead') || item.includes('rdr')) {
                 alert("Red Dead Redemption 2, like Kemo_otak knows!");
                 searchInput.value = '';
              } else {
                 document.getElementById('kemo-search').submit(); 
              }
            });
            autocompleteList.appendChild(div);
         });
         autocompleteList.style.display = 'block';
       } else {
         autocompleteList.style.display = 'none';
       }
    };

    document.addEventListener('click', function(e) {
      if (e.target !== searchInput) {
        autocompleteList.style.display = 'none';
      }
    });

    document.getElementById('kemo-search').addEventListener('submit', function(event) {
      const q = searchInput.value.toLowerCase().trim();
      if ((q.includes('best') && q.includes('game')) || q.includes('red dead') || q.includes('rdr')) {
        event.preventDefault(); 
        alert("Red Dead Redemption 2, like Kemo_otak knows!");
        searchInput.value = '';
        autocompleteList.style.display = 'none';
      }
    });

    const lyricsBox = document.getElementById('lyrics-box');
    let lyricsVisible = true;

    toggleLyricsBtn.addEventListener('click', () => {
      lyricsVisible = !lyricsVisible;
      if (lyricsVisible) {
        lyricsBox.style.display = 'flex';
        toggleLyricsBtn.innerText = 'LYRICS: ON';
      } else {
        lyricsBox.style.display = 'none';
        toggleLyricsBtn.innerText = 'LYRICS: OFF';
      }
    });

    // ----------------------------------------------------

    // ----------------------------------------------------

    const audioPlayer = document.getElementById('x-audio');
    const playBtn = document.getElementById('x-play');
    const prevBtn = document.getElementById('x-prev');
    const nextBtn = document.getElementById('x-next');
    const titleDisplay = document.getElementById('x-title');
    const artistDisplay = document.getElementById('x-artist');
    const playlistContainer = document.getElementById('x-list');

    // Build the visible playlist
    tracks.forEach((track, index) => {
      const item = document.createElement('div');
      item.className = 'playlist-item';
      item.innerHTML = `<span>${index + 1}. ${track.title}</span> <span style="font-size:9px; color:#555;">${track.artist}</span>`;
      item.onclick = () => loadTrack(index, true);
      playlistContainer.appendChild(item);
    });

    function loadTrack(index, playNow = false) {
      currentIndex = index;
      const track = tracks[index];
      
      titleDisplay.innerText = track.title;
      artistDisplay.innerText = track.artist;
      document.getElementById('lyrics-title').innerText = "LYRICS: " + track.title;
      document.getElementById('lyrics-text').innerText = track.lyrics;
      
      document.getElementById('lyrics-text').scrollTop = 0;
      
      const items = document.querySelectorAll('.playlist-item');
      items.forEach(i => i.classList.remove('active'));
      if(items[index]) {
        items[index].classList.add('active');
        items[index].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      audioPlayer.src = `${track.id}.mp3`;

      if (playNow) {
        audioPlayer.play().catch(e => console.log("Missing MP3 file on Github"));
        playBtn.innerText = '⏸';
      }

      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: track.artist,
          album: 'XEMOX Audio Engine',
          artwork: [
            { src: 'sasd.jpg', sizes: '96x96', type: 'image/jpeg' },
            { src: 'sasd.jpg', sizes: '512x512', type: 'image/jpeg' }
          ]
        });

        navigator.mediaSession.setActionHandler('play', () => playBtn.onclick());
        navigator.mediaSession.setActionHandler('pause', () => playBtn.onclick());
        navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.onclick());
        navigator.mediaSession.setActionHandler('nexttrack', () => nextBtn.onclick());
      }
    }

    audioPlayer.addEventListener('timeupdate', () => {
      if (audioPlayer.duration) {
        const progress = audioPlayer.currentTime / audioPlayer.duration;
        const lyricsText = document.getElementById('lyrics-text');
        const maxScroll = lyricsText.scrollHeight - lyricsText.clientHeight;
        
        if (maxScroll > 0) {
          lyricsText.scrollTop = maxScroll * progress;
        }
      }
    });

    playBtn.onclick = () => {
      if (audioPlayer.paused) {
        audioPlayer.play().catch(e => alert("Please upload " + tracks[currentIndex].id + ".mp3 to your GitHub to play this track!"));
        playBtn.innerText = '⏸';
      } else {
        audioPlayer.pause();
        playBtn.innerText = '▶';
      }
    };

    nextBtn.onclick = () => {
      let nextIndex = currentIndex + 1 >= tracks.length ? 0 : currentIndex + 1;
      loadTrack(nextIndex, true);
    };

    prevBtn.onclick = () => {
      let prevIndex = currentIndex - 1 < 0 ? tracks.length - 1 : currentIndex - 1;
      loadTrack(prevIndex, true);
    };

    audioPlayer.onended = () => nextBtn.onclick();

    if(tracks.length > 0) {
      loadTrack(0, false);
    }

    // BACKGROUND SYSTEM
    const dbName = "KemoCommandDB_Final";
    let db;
    const request = indexedDB.open(dbName, 1);

    request.onupgradeneeded = function(e) {
      db = e.target.result;
      if (!db.objectStoreNames.contains("bgStore")) db.createObjectStore("bgStore");
    };

    request.onsuccess = function(e) {
      db = e.target.result;
      const tx = db.transaction("bgStore", "readonly");
      const req = tx.objectStore("bgStore").get("myCustomBg");
      req.onsuccess = function() {
        if (req.result && req.result.fileData) {
          applyBg(URL.createObjectURL(req.result.fileData), req.result.fileType);
        } else {
          document.getElementById('live-bg').style.display = 'block';
          document.getElementById('static-bg').style.display = 'none';
          isLive = true;
          document.getElementById('live-bg').play().catch(e => console.log("Autoplay blocked"));
        }
      };
    };

    let isLive = true; 

    function applyBg(url, type) {
      const liveBg = document.getElementById('live-bg');
      const staticBg = document.getElementById('static-bg');
      if (type.startsWith('video/')) {
        liveBg.src = url;
        liveBg.style.display = 'block';
        staticBg.style.display = 'none';
        isLive = true;
        liveBg.play().catch(e => console.log("Video Autoplay Blocked"));
      } else if (type.startsWith('image/')) {
        staticBg.style.backgroundImage = `url(${url})`;
        staticBg.style.display = 'block';
        liveBg.style.display = 'none';
        isLive = false;
        liveBg.pause();
      }
    }

    document.getElementById('bg-upload').addEventListener('change', function(e) {
      if (e.target.files[0]) {
        const file = e.target.files[0];
        const tx = db.transaction("bgStore", "readwrite");
        tx.objectStore("bgStore").put({ fileData: file, fileType: file.type }, "myCustomBg");
        applyBg(URL.createObjectURL(file), file.type);
      }
    });

    document.getElementById('toggle-bg-btn').addEventListener('click', () => {
      const liveBg = document.getElementById('live-bg');
      const staticBg = document.getElementById('static-bg');
      isLive = !isLive;
      if (isLive && liveBg.src) {
        liveBg.style.display = 'block';
        staticBg.style.display = 'none';
        liveBg.play();
      } else {
        liveBg.style.display = 'none';
        staticBg.style.display = 'block';
        liveBg.pause();
      }
    });
  </script>
</body>
</html>
