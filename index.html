<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kemo_otak Command Center | NEON</title>
  <style>
    body {
      margin: 0;
      height: 100vh; 
      overflow: hidden; 
      background-color: #030b14;
      color: #00e5ff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      position: relative;
    }

    /* --- BACKGROUNDS --- */
    #static-bg, #live-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      transition: opacity 0.5s ease;
    }
    
    /* Default Neon/Cyberpunk Image fallback */
    #static-bg {
      background: url('https://images.unsplash.com/photo-1605901309584-818e25960b8f?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
      display: block; /* By default, show the static image */
    }

    /* Hide the video by default until loaded */
    #live-bg {
      display: none;
    }

    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 11, 20, 0.7); 
      z-index: -1;
    }

    /* --- TOP CONTROLS --- */
    .controls-container {
      position: absolute;
      top: 15px;
      left: 20px;
      display: flex;
      gap: 15px;
      z-index: 10;
    }

    .control-btn {
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid #00e5ff;
      color: #00e5ff;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      font-weight: bold;
      backdrop-filter: blur(5px);
      transition: 0.3s;
      text-transform: uppercase;
    }

    .control-btn:hover {
      background: rgba(0, 229, 255, 0.3);
      box-shadow: 0 0 15px #00e5ff;
      transform: scale(1.05);
    }

    .secret-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      color: #333;
      text-decoration: none;
      font-size: 12px;
      opacity: 0.4;
      transition: 0.4s;
      letter-spacing: 2px;
      z-index: 10;
    }

    .secret-btn:hover {
      opacity: 1;
      color: #00e5ff;
      text-shadow: 0 0 8px #00e5ff;
    }

    /* --- PROFILE --- */
    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #00e5ff;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
      z-index: 1;
      transition: 0.3s;
    }
    
    .profile-pic:hover {
      box-shadow: 0 0 40px rgba(0, 85, 255, 0.8);
      border-color: #0055ff;
    }

    /* --- SEARCH --- */
    .search-container {
      width: 100%;
      text-align: center;
      z-index: 1;
      padding: 0 20px;
      box-sizing: border-box;
    }
    
    .search-form {
      display: flex;
      justify-content: center;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .search-form input {
      padding: 15px 20px;
      flex: 1;
      background: rgba(10, 15, 25, 0.7);
      backdrop-filter: blur(10px);
      border: 2px solid #0055ff;
      color: white;
      border-radius: 8px 0 0 8px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
      min-width: 0;
    }

    .search-form input:focus {
      border-color: #00e5ff; 
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
    }

    .search-form button {
      padding: 15px 25px;
      background-color: #00e5ff;
      border: none;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      transition: 0.3s;
      text-transform: uppercase;
    }

    .search-form button:hover {
      background-color: #0055ff;
      color: white;
      box-shadow: 0 0 15px #0055ff;
    }

    /* --- QUICK LINKS --- */
    .quick-links {
      display: flex;
      gap: 20px;
      margin-top: 10px;
      z-index: 1;
      flex-wrap: wrap;
      justify-content: center;
    }

    .shortcut {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #99aab5;
      transition: 0.3s;
    }

    .shortcut-icon {
      width: 50px;
      height: 50px;
      background: rgba(10, 15, 25, 0.6);
      backdrop-filter: blur(5px);
      border: 1px solid #0055ff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 8px;
      transition: 0.3s;
    }

    .shortcut:hover .shortcut-icon {
      border-color: #00e5ff;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
      transform: translateY(-5px);
      color: #00e5ff;
    }

    .shortcut:hover {
      color: #00e5ff;
    }

    /* --- MOBILE RESPONSIVE TWEAKS --- */
    @media (max-width: 600px) {
      .controls-container {
        flex-direction: column; 
        gap: 8px;
        top: 10px;
        left: 10px;
      }
      .control-btn {
        padding: 6px 10px;
        font-size: 10px;
      }
      .secret-btn {
        top: 10px;
        right: 10px;
      }
      .profile-pic {
        width: 90px;
        height: 90px;
      }
      .search-form input, .search-form button {
        padding: 12px 15px;
        font-size: 14px;
      }
      .shortcut-icon {
        width: 45px;
        height: 45px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <!-- BACKGROUNDS -->
  <video id="live-bg" autoplay loop muted playsinline></video>
  <div id="static-bg"></div>
  <div class="bg-overlay"></div>

  <!-- BG CONTROLS -->
  <div class="controls-container">
    <button id="toggle-bg-btn" class="control-btn">SWITCH BG</button>
    <label for="bg-upload" class="control-btn" style="cursor: pointer; text-align: center;">UPLOAD MP4/GIF</label>
    <input type="file" id="bg-upload" accept="image/*,video/*" hidden>
  </div>

  <a href="https://plan-for-tahiti-o4vw83mxl-kareemmohamedharidy-7974s-projects.vercel.app/" class="secret-btn">[ SYS.PORTFOLIO ]</a>

  <img src="sasd.jpg" alt="Kemo_otak" class="profile-pic">

  <div class="search-container">
    <form id="kemo-search" class="search-form" action="https://www.google.com/search" method="get">
      <input type="text" id="search-input" name="q" placeholder="Search the web or enter secret code..." required autocomplete="off">
      <button type="submit">SEARCH</button>
    </form>
  </div>

  <div class="quick-links">
    <a href="https://www.youtube.com" class="shortcut">
      <div class="shortcut-icon">▶</div><span>YouTube</span>
    </a>
    <a href="https://discord.com/app" class="shortcut">
      <div class="shortcut-icon">🎮</div><span>Discord</span>
    </a>
    <a href="https://web.whatsapp.com" class="shortcut">
      <div class="shortcut-icon">💬</div><span>WhatsApp</span>
    </a>
    <a href="https://github.com/Kemotl" class="shortcut">
      <div class="shortcut-icon">💻</div><span>GitHub</span>
    </a>
  </div>

  <script>
    // Search Easter Egg
    document.getElementById('kemo-search').addEventListener('submit', function(event) {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      if (query === 'the best game ever') {
        event.preventDefault(); 
        alert("Red Dead Redemption 2, like Kemo_otak knows!");
        document.getElementById('search-input').value = '';
      }
    });

    // ----------------------------------------------------
    // INDEXED-DB SYSTEM: Saves File perfectly without corruption
    // ----------------------------------------------------
    const liveBg = document.getElementById('live-bg');
    const staticBg = document.getElementById('static-bg');
    const toggleBtn = document.getElementById('toggle-bg-btn');
    const uploadInput = document.getElementById('bg-upload');
    let isLive = false; 

    const dbName = "KemoDB_V2";
    let db;
    const request = indexedDB.open(dbName, 1);

    request.onupgradeneeded = function(e) {
      db = e.target.result;
      if (!db.objectStoreNames.contains("bgStore")) {
        db.createObjectStore("bgStore");
      }
    };

    request.onsuccess = function(e) {
      db = e.target.result;
      loadSavedBg(); 
    };

    // Save actual File object to avoid corruption
    function saveBg(file) {
      const tx = db.transaction("bgStore", "readwrite");
      const store = tx.objectStore("bgStore");
      store.put({ fileData: file, fileType: file.type }, "myCustomBg");
    }

    function loadSavedBg() {
      const tx = db.transaction("bgStore", "readonly");
      const store = tx.objectStore("bgStore");
      const req = store.get("myCustomBg");

      req.onsuccess = function() {
        if (req.result && req.result.fileData) {
          const data = req.result;
          const fileURL = URL.createObjectURL(data.fileData);
          applyBg(fileURL, data.fileType);
        }
      };
    }

    function applyBg(url, type) {
      if (type.startsWith('video/')) {
        liveBg.src = url;
        liveBg.style.display = 'block';
        staticBg.style.display = 'none';
        isLive = true;
        liveBg.play().catch(e => console.log("Autoplay blocked by browser", e));
      } else if (type.startsWith('image/')) {
        staticBg.style.backgroundImage = `url(${url})`;
        staticBg.style.display = 'block';
        liveBg.style.display = 'none';
        isLive = false;
        liveBg.pause();
      }
    }

    uploadInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        saveBg(file); 
        applyBg(URL.createObjectURL(file), file.type);
      }
    });

    toggleBtn.addEventListener('click', () => {
      isLive = !isLive;
      if (isLive && liveBg.src) {
        liveBg.style.display = 'block';
        staticBg.style.display = 'none';
        liveBg.play();
      } else {
        liveBg.style.display = 'none';
        staticBg.style.display = 'block';
        liveBg.pause();
      }
    });
  </script>

</body>
</html>
